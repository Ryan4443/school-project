  <style>
    /* ==========================================================================
       Liquid Glass & Universal Sizing Variables (Phone to 4K TV)
       ========================================================================== */
    :root {
      --bg-current: #0b301e;
      --glass-panel: rgba(16, 52, 34, 0.65);
      --glass-panel-light: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-glow: rgba(52, 211, 153, 0.45);
      --glass-specular: inset 0 1px 1px 0 rgba(255, 255, 255, 0.4), 0 15px 40px rgba(0, 0, 0, 0.35);
      
      --cane-green: #10b981;
      --cane-glow: #34d399;
      --cane-light: #a7f3d0;
      --cane-emerald: #059669;
      --accent-gold: #fbbf24;
      --text-main: #ffffff;
      --text-dim: #cbd5e1;
      
      --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-serif: 'Playfair Display', serif;
      
      --ease-snappy: cubic-bezier(0.18, 0.9, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);

      /* Pointer Ray Coordinates */
      --cursor-x: 50vw;
      --cursor-y: 35vh;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg-current);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      line-height: 1.55;
      transition: background-color 0.4s var(--ease-snappy);
    }

    /* Dynamic Finger / Mouse Interactive Light Ray */
    .liquid-spotlight {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(
        550px circle at var(--cursor-x) var(--cursor-y),
        rgba(52, 211, 153, 0.3) 0%,
        rgba(16, 185, 129, 0.1) 40%,
        transparent 70%
      );
      mix-blend-mode: screen;
      will-change: background;
      transition: opacity 0.3s ease;
    }

    /* Ambient Canopy Canvas */
    .ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle at 50% 12%, rgba(52, 211, 153, 0.32) 0%, transparent 65%),
                  radial-gradient(circle at 85% 20%, rgba(251, 191, 36, 0.2) 0%, transparent 50%),
                  radial-gradient(circle at 15% 75%, rgba(16, 185, 129, 0.25) 0%, transparent 60%),
                  radial-gradient(circle at 80% 85%, rgba(163, 230, 53, 0.18) 0%, transparent 55%);
      animation: ambientShift 12s ease-in-out infinite alternate;
    }

    @keyframes ambientShift {
      0% { transform: scale(1) translateY(0); opacity: 0.9; }
      100% { transform: scale(1.04) translateY(-10px); opacity: 1; }
    }

    /* Header Navigation */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(8, 36, 22, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.25), inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(0.7rem, 1.5vw, 0.95rem) clamp(1rem, 4vw, 3.5rem);
    }

    .brand-block {
      display: flex;
      flex-direction: column;
    }

    .authors-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.4px;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
    }

    .authors-row .project-pill {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      font-size: 0.68rem;
      padding: 0.18rem 0.55rem;
      border-radius: 9999px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }

    .project-subtitle {
      font-size: clamp(0.65rem, 1.2vw, 0.75rem);
      color: var(--cane-light);
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: clamp(1.2rem, 2vw, 2.2rem);
      list-style: none;
    }

    .nav-links a {
      color: #e2e8f0;
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: color 0.2s var(--ease-snappy);
    }

    .nav-links a:hover {
      color: var(--cane-glow);
    }

    .header-action-btn {
      background: var(--glass-panel-light);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), 0 4px 15px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #ffffff;
      padding: clamp(0.45rem, 1vw, 0.6rem) clamp(0.9rem, 1.8vw, 1.4rem);
      border-radius: 9999px;
      font-family: var(--font-display);
      font-size: clamp(0.78rem, 1.2vw, 0.86rem);
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.25s var(--ease-snappy);
    }

    .header-action-btn:hover {
      border-color: var(--cane-glow);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.4), 0 0 20px rgba(52, 211, 153, 0.45);
      transform: translateY(-2px);
    }

    /* Hero Showcase Container */
    .hero-container {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(5.5rem, 12vh, 7.5rem) clamp(0.8rem, 3vw, 2rem) 2.5rem;
      text-align: center;
      z-index: 10;
      user-select: none;
    }

    .carousel-dock {
      position: relative;
      width: 100%;
      max-width: 1240px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: clamp(0.6rem, 2vw, 1.5rem);
      margin: 0.25rem 0;
    }

    /* Desktop Navigation Arrows */
    .nav-arrow-btn {
      width: clamp(48px, 5vw, 64px);
      height: clamp(48px, 5vw, 64px);
      min-width: clamp(48px, 5vw, 64px);
      border-radius: 50%;
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      transition: all 0.2s var(--ease-snappy);
    }

    .nav-arrow-btn:hover {
      border-color: var(--cane-glow);
      background: rgba(16, 185, 129, 0.35);
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.5);
    }

    .nav-arrow-btn:active {
      transform: scale(0.92);
    }

    /* Side Preview Cards */
    .side-card {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular);
      border-radius: 24px;
      padding: 1.1rem 0.85rem;
      width: clamp(160px, 15vw, 205px);
      cursor: pointer;
      opacity: 0.8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: all 0.25s var(--ease-snappy);
    }

    .side-card:hover {
      opacity: 1;
      transform: scale(1.04) translateY(-3px);
      border-color: var(--cane-glow);
      box-shadow: 0 0 25px rgba(52, 211, 153, 0.35), var(--glass-specular);
    }

    .side-mini-portal {
      width: clamp(55px, 6vw, 75px);
      height: clamp(55px, 6vw, 75px);
      border-radius: 18px;
      background: #062b18;
      border: 1.5px solid var(--cane-glow);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .side-card-name {
      font-family: var(--font-display);
      font-size: clamp(0.75rem, 1vw, 0.85rem);
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Center Featured Stage */
    .center-stage {
      position: relative;
      flex: 1;
      max-width: 640px;
      width: 100%;
      padding: 0 clamp(0.25rem, 2vw, 1rem);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .center-halo {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: clamp(240px, 40vw, 360px);
      height: clamp(240px, 40vw, 360px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 211, 153, 0.4) 0%, rgba(16, 185, 129, 0.1) 55%, transparent 75%);
      filter: blur(35px);
      z-index: -1;
      pointer-events: none;
      animation: pulseAura 4s ease-in-out infinite alternate;
    }

    @keyframes pulseAura {
      0% { transform: translate(-50%, -50%) scale(0.95); opacity: 0.75; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* Split-Assemble Stalk Portal */
    .split-portal-box {
      position: relative;
      width: clamp(170px, 40vw, 240px);
      height: clamp(190px, 28vh, 260px);
      margin-bottom: clamp(0.8rem, 2vh, 1.3rem);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
    }

    .stalk-assembly {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.28s var(--ease-spring);
    }

    .seg-crown, .seg-upper, .seg-mid, .seg-base {
      position: relative;
      transition: transform 0.28s var(--ease-spring), opacity 0.2s ease;
      will-change: transform, opacity;
    }

    .seg-crown { z-index: 5; }
    .seg-upper { margin-top: -6px; z-index: 4; }
    .seg-mid   { margin-top: -5px; z-index: 3; }
    .seg-base  { margin-top: -5px; z-index: 2; }

    /* Fast Splitting Animation State */
    .is-splitting .seg-crown {
      transform: translateY(-65px) scale(0.88) rotate(-6deg);
      opacity: 0;
    }
    .is-splitting .seg-upper {
      transform: translateY(-25px) scale(0.92);
      opacity: 0.3;
    }
    .is-splitting .seg-mid {
      transform: scale(0.85) rotate(4deg);
      opacity: 0.3;
    }
    .is-splitting .seg-base {
      transform: translateY(65px) scale(0.88) rotate(6deg);
      opacity: 0;
    }

    /* Exploded Anatomy View */
    .is-exploded .seg-crown { transform: translateY(-38px); }
    .is-exploded .seg-upper { transform: translateY(-12px); }
    .is-exploded .seg-mid   { transform: translateY(12px); }
    .is-exploded .seg-base  { transform: translateY(38px); }

    .anatomy-label-pill {
      position: absolute;
      background: rgba(8, 38, 22, 0.94);
      border: 1px solid var(--cane-glow);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 10px rgba(52, 211, 153, 0.3);
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      font-size: clamp(0.65rem, 1.1vw, 0.72rem);
      font-weight: 700;
      color: #fff;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s var(--ease-spring);
      white-space: nowrap;
      z-index: 10;
    }

    .is-exploded .anatomy-label-pill { opacity: 1; }

    .pill-crown { top: 8px; right: -70px; }
    .pill-node  { top: 75px; left: -75px; }
    .pill-pith  { top: 125px; right: -75px; }
    .pill-base  { bottom: 10px; left: -70px; }

    .explode-toggle-btn {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      color: var(--cane-light);
      box-shadow: var(--glass-specular);
      padding: 0.32rem 0.85rem;
      border-radius: 9999px;
      font-size: clamp(0.72rem, 1.2vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: clamp(0.4rem, 1.5vh, 0.75rem);
      transition: all 0.2s var(--ease-snappy);
    }

    .explode-toggle-btn:hover {
      border-color: var(--cane-glow);
      color: #ffffff;
      transform: scale(1.04);
    }

    .tag-bubble {
      display: inline-block;
      font-size: clamp(0.7rem, 1.2vw, 0.8rem);
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--cane-glow);
      margin-bottom: 0.25rem;
      background: rgba(52, 211, 153, 0.16);
      border: 1px solid rgba(52, 211, 153, 0.35);
      padding: 0.2rem 0.8rem;
      border-radius: 9999px;
    }

    .main-title {
      font-family: var(--font-display);
      font-size: clamp(2.1rem, 6vw, 3.4rem);
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 0.2rem;
      letter-spacing: 0.5px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .main-botanical {
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--cane-light);
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      margin-bottom: 0.65rem;
    }

    .main-desc {
      color: #e2e8f0;
      font-size: clamp(0.88rem, 1.5vw, 1rem);
      line-height: 1.6;
      max-width: 520px;
      margin-bottom: clamp(1rem, 2vh, 1.4rem);
    }

    .specs-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      justify-content: center;
      margin-bottom: clamp(1.1rem, 2.2vh, 1.6rem);
      width: 100%;
    }

    .spec-badge {
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular);
      border-radius: 9999px;
      padding: 0.4rem 0.95rem;
      font-size: clamp(0.75rem, 1.2vw, 0.84rem);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .spec-badge .badge-metric {
      color: var(--cane-glow);
      font-weight: 700;
    }

    .action-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      width: 100%;
    }

    .primary-glass-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.45), inset 0 1px 1px 0 rgba(255, 255, 255, 0.4);
      padding: clamp(0.75rem, 1.8vh, 0.95rem) clamp(1.4rem, 4vw, 2.3rem);
      border-radius: 9999px;
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 1.3vw, 0.95rem);
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s var(--ease-snappy);
    }

    .primary-glass-btn:hover {
      box-shadow: 0 12px 35px rgba(52, 211, 153, 0.65), inset 0 1px 1px 0 rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .audio-glass-btn {
      width: clamp(44px, 5vw, 52px);
      height: clamp(44px, 5vw, 52px);
      min-width: clamp(44px, 5vw, 52px);
      border-radius: 50%;
      background: var(--glass-panel);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-specular);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s var(--ease-snappy);
    }

    .audio-glass-btn:hover {
      border-color: var(--cane-glow);
      background: rgba(52, 211, 153, 0.28);
      transform: scale(1.08);
    }

---

### What Was Updated:

1. **Universal Smartphone Scaling (No Pinch-to-Zoom Needed)**:
   * Replaced fixed pixel dimensions with fluid `clamp()` sizing. On Android and iOS screens, the stalk visualizer, headers, and specification badges scale down naturally to fit the screen height without cutoffs.
   * Added a dedicated mobile navigation bar (`< Prev` `1 / 5` `Next >`) beneath the action buttons on narrow viewports, alongside swipe gestures.

2. **Interactive Finger & Cursor Light Ray**:
   * A dynamic specular spotlight actively tracks your finger touches or mouse pointer in real time via hardware-accelerated rendering (`requestAnimationFrame`).
   * As you interact with the screen, a luminous mint-emerald sheen refracts across the liquid glass cards.

3. **Snappy, Fast Transitions**:
   * Reduced the split-and-assemble sequence to **160ms–240ms** with responsive spring physics, eliminating sluggish delays when switching varieties.

4. **Brighter, Lively Background**:
   * Tuned the canvas to radiant, sunny plantation greens with an animated multi-source ambient canopy glow.

5. **Smart TV & 4K Projector Support**:
   * Includes high-visibility `:focus-visible` emerald rings for TV remote D-pads and scaled typography for viewing from 8–10 feet away.
