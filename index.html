<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Moonlit Citadel: Eclipse Raid</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #05050d; color: #e2e8f0; font-family: 'Inter', system-ui, sans-serif; touch-action: none; }
    .ff { font-family: 'Cinzel', Georgia, serif; }
    #wrap { position: fixed; inset: 0; z-index: 1; background: #05050d; }
    #cv { display: block; width: 100%; height: 100%; cursor: grab; }
    #cv:active { cursor: grabbing; }
    #cv.ps2 { image-rendering: pixelated; filter: contrast(1.16) saturate(1.14); }
    #ps2-fx {
      position: fixed; inset: 0; pointer-events: none; z-index: 4;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.22) 0px, rgba(0,0,0,0.22) 1px, transparent 1px, transparent 3px),
                  radial-gradient(circle at center, transparent 48%, rgba(4,2,14,0.72) 100%);
    }
    #fx-hurt, #fx-parry { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.14s; }
    #fx-hurt { background: radial-gradient(circle, transparent 36%, rgba(220,38,38,0.58) 100%); }
    #fx-parry { background: radial-gradient(circle, rgba(250,204,21,0.22) 0%, rgba(168,85,247,0.4) 100%); }
    #xhair { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 12px; height: 12px; pointer-events: none; z-index: 12; opacity: 0.78; }
    #xhair::before, #xhair::after { content: ''; position: absolute; background: #e2e8f0; box-shadow: 0 0 4px #000; }
    #xhair::before { top: 5px; left: 0; width: 12px; height: 2px; }
    #xhair::after { left: 5px; top: 0; width: 2px; height: 12px; }

    .pnl { background: rgba(8,9,20,0.84); border: 1px solid rgba(148,163,214,0.28); box-shadow: 0 6px 18px rgba(0,0,0,0.65); }
    .btn { background: rgba(16,18,36,0.88); border: 1px solid rgba(165,180,232,0.3); color: #e2e8f0; cursor: pointer; transition: transform 0.08s, background 0.12s; }
    .btn:hover { background: rgba(34,38,74,0.94); border-color: rgba(192,132,252,0.65); }
    .btn:active, .btn.pressed { transform: scale(0.92); background: rgba(76,29,149,0.72); }

    /* Clean Z-Index Stack so Mobile Buttons Never Overlap */
    #hud { position: fixed; inset: 0; width: 100%; height: 100dvh; pointer-events: none; z-index: 20; }
    #look-pad { position: fixed; inset: 0; z-index: 10; touch-action: none; pointer-events: auto; }
    #touch-ui { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
    #touch-actions { position: fixed; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); pointer-events: auto; }
    #hud-tl, #hud-tr, #hud-bc { z-index: 30; }
    #hud-tc { z-index: 40; }
    #modal { z-index: 50; }
    #title { z-index: 70; }
    #land-guard { z-index: 90; }

    #joy-base { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 104px; height: 104px; border-radius: 50%; background: rgba(10,12,26,0.56); border: 1.5px solid rgba(165,180,252,0.38); pointer-events: auto; touch-action: none; }
    #joy-knob { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #dbeafe, #6d28d9); border: 1.5px solid rgba(255,255,255,0.6); pointer-events: none; }

    @keyframes popUp { 0% { opacity: 1; transform: translate(-50%,0) scale(0.9); } 25% { opacity: 1; transform: translate(-50%,-14px) scale(1.1); } 100% { opacity: 0; transform: translate(-50%,-42px) scale(0.95); } }
    .pop { position: fixed; pointer-events: none; font-weight: 800; z-index: 35; text-shadow: 0 2px 6px #000; animation: popUp 0.75s ease-out forwards; white-space: nowrap; }
    .r-C { color: #cbd5e1; } .r-R { color: #60a5fa; } .r-E { color: #c084fc; } .r-L { color: #fbbf24; } .r-M { color: #f472b6; }
    .scroll-y { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
    .scroll-x { overflow-x: auto; touch-action: pan-x; -webkit-overflow-scrolling: touch; }
    @media (max-height: 460px) {
      #hud-tl { transform: scale(0.84); transform-origin: top left; }
      #hud-tr { transform: scale(0.84); transform-origin: top right; }
      #hud-tc { transform: translateX(-50%) scale(0.86); transform-origin: top center; }
      #joy-base { width: 90px; height: 90px; }
    }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="cv" class="ps2"></canvas></div>
  <div id="ps2-fx"></div>
  <div id="fx-hurt"></div>
  <div id="fx-parry"></div>
  <div id="xhair" class="hidden"></div>
  <div id="pops" class="fixed inset-0 pointer-events-none z-30"></div>

  <!-- MOBILE LANDSCAPE PROMPT -->
  <div id="land-guard" class="hidden fixed inset-0 bg-[#05050d]/95 flex items-center justify-center p-5 text-center">
    <div class="pnl rounded-2xl max-w-xs w-full p-5 flex flex-col items-center gap-3">
      <div class="text-3xl">📱↻</div>
      <h2 class="ff text-lg font-bold text-indigo-100">Rotate to Landscape</h2>
      <button id="btn-fs-land" class="btn w-full py-2.5 rounded-xl font-bold text-xs bg-indigo-800/80 border-purple-400/60">Fullscreen Landscape</button>
      <button id="btn-land-skip" class="text-[11px] text-slate-400 underline">Continue</button>
    </div>
  </div>

  <!-- MINIMAL TITLE SCREEN -->
  <div id="title" class="fixed inset-0 bg-gradient-to-b from-[#060614]/82 via-[#120b28]/78 to-[#05050d]/95 flex items-center justify-center p-4">
    <div class="pnl rounded-2xl max-w-sm w-full p-6 text-center">
      <h1 class="ff text-3xl font-bold text-blue-50 tracking-wider">MOONLIT CITADEL</h1>
      <p class="ff text-[11px] tracking-[0.22em] text-amber-200/85 mt-1 mb-4">ECLIPSE RAID</p>
      <div id="save-badge" class="hidden mb-3 inline-block px-3 py-1 rounded-full bg-purple-950/70 border border-purple-400/45 text-[11px] text-purple-200"></div>
      <div class="flex gap-2 justify-center">
        <button id="btn-play" class="btn flex-1 py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-700 via-purple-700 to-indigo-700 border-purple-300/60">Play</button>
        <button id="btn-title-fs" class="btn px-4 py-3 rounded-xl font-semibold text-xs">⛶</button>
      </div>
      <div class="mt-4 pt-3 border-t border-white/10 text-[10px] text-slate-400">
        WASD Move • LMB Hit • F/RMB Parry • Shift Roll • H Steed • V POV • I Menu
      </div>
    </div>
  </div>

  <!-- MINIMAL HUD -->
  <div id="hud" class="hidden fixed inset-0 pointer-events-none">
    <div id="look-pad" class="hidden"></div>

    <!-- TOP-LEFT: Vitals & Stance -->
    <div id="hud-tl" class="fixed top-2 left-2 flex flex-col gap-1.5 pointer-events-auto w-[212px] sm:w-[230px]">
      <div class="pnl rounded-xl p-2 flex flex-col gap-1">
        <div class="flex items-center justify-between text-[10px]">
          <button id="btn-lv" class="btn px-2 py-0.5 rounded-lg font-bold text-amber-200 border-amber-400/50">LV <span id="h-lv">1</span> <span id="h-pts" class="hidden text-emerald-300">(+0)</span></button>
          <span class="text-amber-300 font-semibold">🪙<span id="h-gold">0</span></span>
          <span class="text-fuchsia-300 font-semibold">✦<span id="h-ess">0</span></span>
          <span class="text-purple-300 font-semibold">R<span id="h-rb">0</span></span>
        </div>
        <div class="flex items-center gap-1 text-[9px]"><span class="text-rose-300 font-bold w-4">HP</span><div class="flex-1 h-1.5 bg-black/80 rounded-full overflow-hidden"><div id="b-hp" class="h-full bg-rose-500" style="width:100%"></div></div><span id="t-hp" class="w-12 text-right">200/200</span></div>
        <div class="flex items-center gap-1 text-[9px]"><span class="text-sky-300 font-bold w-4">MP</span><div class="flex-1 h-1.5 bg-black/80 rounded-full overflow-hidden"><div id="b-mp" class="h-full bg-indigo-400" style="width:100%"></div></div><span id="t-mp" class="w-12 text-right">140/140</span></div>
        <div class="flex items-center gap-1 text-[9px]"><span class="text-amber-300 font-bold w-4">ST</span><div class="flex-1 h-1 bg-black/80 rounded-full overflow-hidden"><div id="b-st" class="h-full bg-amber-400" style="width:100%"></div></div><span id="t-parry" class="w-12 text-right text-emerald-300 font-semibold">PARRY</span></div>
      </div>
      <div class="pnl rounded-lg px-2 py-1 flex items-center justify-between gap-1 text-[10px]">
        <span id="h-gear" class="truncate text-blue-100 font-semibold">Moonsteel Longsword</span>
        <button id="btn-stance" class="btn shrink-0 px-1.5 py-0.5 rounded text-[10px]">⚔️⇄🪄</button>
      </div>
    </div>

    <!-- TOP-CENTER: Zone, Raid Wave, Enemy Target & Toast -->
    <div id="hud-tc" class="fixed top-2 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1 w-[196px] sm:w-[256px] pointer-events-none">
      <div id="zone-bar" class="pnl rounded-full px-3 py-0.5 text-[10px] font-semibold text-indigo-200">Moonlit Cottage</div>
      <div id="raid-bar" class="hidden pnl rounded-xl px-2.5 py-1.5 w-full flex items-center justify-between gap-2 pointer-events-auto border-purple-400/55">
        <div class="text-[10px] leading-tight">
          <div id="raid-wv" class="ff font-bold text-purple-200">WAVE 0/20</div>
          <div id="raid-left" class="text-[9px] text-slate-300">Next: Wave 1</div>
        </div>
        <button id="btn-wave" class="btn px-2.5 py-1 rounded-lg text-[10px] font-bold bg-purple-700/80 border-purple-300/70 text-white">WAVE 1 ▶</button>
      </div>
      <div id="tgt-bar" class="hidden pnl rounded-xl px-2.5 py-1 w-full border-rose-400/50">
        <div class="flex justify-between text-[10px] mb-0.5">
          <span id="tgt-nm" class="ff font-bold text-rose-200 truncate">Foe</span>
          <span id="tgt-hp" class="text-slate-300 font-semibold">0/0</span>
        </div>
        <div class="h-1.5 bg-black/80 rounded-full overflow-hidden">
          <div id="tgt-f" class="h-full bg-gradient-to-r from-rose-700 via-rose-500 to-amber-400" style="width:100%"></div>
        </div>
      </div>
      <div id="toast" class="opacity-0 transition-opacity duration-300 pnl rounded-full px-3 py-0.5 text-[10px] font-medium text-blue-100 border-indigo-400/45 text-center"></div>
    </div>

    <!-- TOP-RIGHT: Compact Non-Overlapping Quick Buttons -->
    <div id="hud-tr" class="fixed top-2 right-2 flex flex-col items-end gap-1 pointer-events-auto">
      <div class="flex items-center gap-1">
        <button id="btn-gear" class="btn h-8 px-2 rounded-lg text-[10px] font-bold text-purple-200" title="Weapons &amp; Armor (I)">⚔️ Gear</button>
        <button id="btn-spells" class="btn h-8 px-2 rounded-lg text-[10px] font-bold text-sky-200" title="Spells">✨ Spells</button>
        <button id="btn-rebirth" class="btn h-8 px-2 rounded-lg text-[10px] font-bold text-fuchsia-200" title="Rebirth &amp; Dragon">🟣 Rebirth</button>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-steed" class="btn w-8 h-8 rounded-lg text-xs" title="Steed (H)">🐎</button>
        <button id="btn-pov" class="btn w-8 h-8 rounded-lg text-xs" title="POV (V)">👁️</button>
        <button id="btn-ps2" class="btn h-8 px-1.5 rounded-lg text-[10px] font-bold text-purple-200" title="Toggle PS2/HD">PS2</button>
        <button id="btn-sfx" class="btn w-8 h-8 rounded-lg text-xs" title="Audio (M)">🔊</button>
        <button id="btn-touch" class="btn w-8 h-8 rounded-lg text-xs" title="Toggle Touch Controls">🎮</button>
        <button id="btn-fs" class="btn w-8 h-8 rounded-lg text-xs" title="Fullscreen">⛶</button>
      </div>
    </div>

    <!-- BOTTOM-CENTER: Interact Prompt + Always-Visible Combat & Spell Dock -->
    <div id="hud-bc" class="fixed bottom-2.5 left-1/2 -translate-x-1/2 flex flex-col items-center gap-1.5 pointer-events-none max-w-[96vw]">
      <button id="btn-use" class="hidden pointer-events-auto btn px-4 py-1.5 rounded-full text-xs font-bold text-amber-100 bg-amber-950/80 border-amber-400/75">[E] Interact</button>
      <div id="pc-bar" class="flex pnl rounded-xl p-1 items-center gap-1 pointer-events-auto">
        <button id="pc-atk" class="btn w-10 h-10 rounded-lg flex flex-col items-center justify-center border-rose-400/60 bg-rose-950/50 text-rose-100" title="Attack (LMB)"><span class="text-sm leading-none">⚔️</span><span class="text-[8px] font-bold">HIT</span></button>
        <button id="pc-par" class="btn w-10 h-10 rounded-lg flex flex-col items-center justify-center border-amber-400/60 bg-amber-950/50 text-amber-100" title="Parry (F / RMB)"><span class="text-sm leading-none">🛡️</span><span class="text-[8px] font-bold">PARRY</span></button>
        <button id="pc-rol" class="btn w-10 h-10 rounded-lg flex flex-col items-center justify-center text-sky-100" title="Dodge Roll (Shift)"><span class="text-sm leading-none">💨</span><span class="text-[8px] font-bold">ROLL</span></button>
        <button id="pc-jmp" class="btn w-9 h-10 rounded-lg flex flex-col items-center justify-center text-slate-200" title="Jump (Space)"><span class="text-xs leading-none">⬆</span><span class="text-[8px] font-bold">JMP</span></button>
        <div class="w-px h-7 bg-white/15 mx-0.5"></div>
        <button data-sp="0" class="sp-btn btn relative w-10 h-10 rounded-lg flex flex-col items-center justify-center"><span id="si-0" class="text-sm leading-none">✨</span><span class="text-[8px] text-purple-200">1</span><div id="sc-0" class="hidden absolute inset-0 rounded-lg bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
        <button data-sp="1" class="sp-btn btn relative w-10 h-10 rounded-lg flex flex-col items-center justify-center"><span id="si-1" class="text-sm leading-none">🌙</span><span class="text-[8px] text-purple-200">2</span><div id="sc-1" class="hidden absolute inset-0 rounded-lg bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
        <button data-sp="2" class="sp-btn btn relative w-10 h-10 rounded-lg flex flex-col items-center justify-center"><span id="si-2" class="text-sm leading-none">❄️</span><span class="text-[8px] text-purple-200">3</span><div id="sc-2" class="hidden absolute inset-0 rounded-lg bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
        <button data-sp="3" class="sp-btn btn relative w-10 h-10 rounded-lg flex flex-col items-center justify-center"><span id="si-3" class="text-sm leading-none">💚</span><span class="text-[8px] text-purple-200">4</span><div id="sc-3" class="hidden absolute inset-0 rounded-lg bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
      </div>
    </div>

    <!-- MOBILE TOUCH CONTROLS -->
    <div id="touch-ui" class="hidden">
      <div id="joy-base"><div id="joy-knob"></div></div>
      <div id="touch-actions" class="flex flex-col items-end gap-1.5">
        <div class="flex gap-1.5">
          <button data-sp="0" class="sp-btn btn relative w-9 h-9 rounded-full flex items-center justify-center text-sm border-purple-400/50"><span id="ti-0">✨</span><div id="tc-0" class="hidden absolute inset-0 rounded-full bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
          <button data-sp="1" class="sp-btn btn relative w-9 h-9 rounded-full flex items-center justify-center text-sm border-purple-400/50"><span id="ti-1">🌙</span><div id="tc-1" class="hidden absolute inset-0 rounded-full bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
          <button data-sp="2" class="sp-btn btn relative w-9 h-9 rounded-full flex items-center justify-center text-sm border-purple-400/50"><span id="ti-2">❄️</span><div id="tc-2" class="hidden absolute inset-0 rounded-full bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
          <button data-sp="3" class="sp-btn btn relative w-9 h-9 rounded-full flex items-center justify-center text-sm border-purple-400/50"><span id="ti-3">💚</span><div id="tc-3" class="hidden absolute inset-0 rounded-full bg-black/80 flex items-center justify-center text-[9px] font-bold"></div></button>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="tb-jmp" class="btn w-10 h-10 rounded-full text-[10px] font-bold text-sky-200">JMP</button>
          <button id="tb-rol" class="btn w-11 h-11 rounded-full text-[10px] font-bold text-amber-200 border-amber-400/50">ROLL</button>
          <button id="tb-par" class="btn w-12 h-12 rounded-full text-[9px] font-bold text-yellow-200 border-yellow-400/60 bg-amber-950/70">🛡️<br>PARRY</button>
          <button id="tb-atk" class="btn w-16 h-16 rounded-full flex flex-col items-center justify-center border-rose-400/75 bg-rose-950/75 text-rose-100"><span class="text-lg leading-none">⚔️</span><span class="text-[9px] font-bold">HIT</span></button>
        </div>
      </div>
    </div>
  </div>

  <!-- STREAMLINED GRIMOIRE MODAL -->
  <div id="modal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-2.5 sm:p-4">
    <div class="pnl rounded-2xl max-w-2xl w-full max-h-[86vh] flex flex-col overflow-hidden">
      <div class="px-3.5 py-2 border-b border-white/10 flex items-center justify-between bg-indigo-950/35">
        <div class="flex items-center gap-2.5 text-xs">
          <span class="ff font-bold text-blue-100">GRIMOIRE</span>
          <span class="text-amber-300 font-semibold">🪙<span id="m-gold">0</span></span>
          <span class="text-fuchsia-300 font-semibold">✦<span id="m-ess">0</span></span>
        </div>
        <button id="btn-mclose" class="btn w-8 h-8 rounded-lg font-bold text-xs">✕</button>
      </div>
      <div class="px-3 py-1.5 border-b border-white/10 flex gap-1.5 scroll-x bg-black/30">
        <button data-tab="stats" class="mtab btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold">⭐ Stats &amp; Skin</button>
        <button data-tab="weapons" class="mtab btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold">⚔️ Weapons</button>
        <button data-tab="armors" class="mtab btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold">🛡️ Armor</button>
        <button data-tab="wands" class="mtab btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold">🪄 Wands</button>
        <button data-tab="spells" class="mtab btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold">✨ Spells</button>
        <button data-tab="rebirth" class="mtab btn shrink-0 px-2.5 py-1 rounded-lg text-[11px] font-semibold">🟣 Rebirth</button>
      </div>
      <div id="modal-body" class="p-3 scroll-y flex-1"></div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* 1. ORIGINAL BUILT-IN SOUNDTRACK ("MOONLIT ELEGY") & SFX */
  const SFX = {
    ctx: null, muted: false, timer: null, step: 0,
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const mel = [293.66, 349.23, 440, 523.25, 440, 392, 349.23, 329.63, 293.66, 261.63, 220, 293.66];
        const bass = [73.42, 73.42, 65.41, 65.41, 58.27, 65.41];
        this.timer = setInterval(() => {
          if (this.muted || !this.ctx || !S.started) return;
          const i = this.step++;
          this.tone(mel[i % mel.length], 0.8, 'triangle', 0.025);
          if (i % 2 === 0) this.tone(bass[(i >> 1) % bass.length], 1.4, 'sine', 0.03);
        }, 640);
      } catch (_) {}
    },
    tone(f, d, type = 'triangle', vol = 0.07, slide = 0) {
      if (this.muted || !this.ctx) return;
      try {
        const now = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.setValueAtTime(f, now);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), now + d);
        g.gain.setValueAtTime(0.0001, now); g.gain.linearRampToValueAtTime(vol, now + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, now + d);
        o.connect(g); g.connect(this.ctx.destination); o.start(now); o.stop(now + d + 0.02);
      } catch (_) {}
    },
    swing: () => SFX.tone(240, 0.11, 'sawtooth', 0.04, 95),
    hit: () => SFX.tone(150, 0.1, 'square', 0.055, 55),
    spell: () => SFX.tone(540, 0.22, 'sine', 0.055, 960),
    parry: (ok) => SFX.tone(ok ? 980 : 320, ok ? 0.24 : 0.1, 'triangle', ok ? 0.095 : 0.04, ok ? 1480 : 220),
    coin: () => SFX.tone(740, 0.12, 'triangle', 0.06, 1120),
    roar: () => SFX.tone(110, 0.45, 'sawtooth', 0.075, 48)
  };

  /* 2. CURATED COMPACT ARSENAL & 4 KNIGHT SKINS */
  const WEAPONS = [

    if (w.style === 'sword' || w.style === 'great') {
      const sc = w.style === 'great' ? 1.38 : 1;
      const gd = new THREE.Mesh(new THREE.BoxGeometry(0.32 * sc, 0.05, 0.05), tr); gd.position.z = 0.17; g.add(gd);
      const bl = new THREE.Mesh(new THREE.BoxGeometry(0.08 * sc, 0.026, 1.15 * sc), bm); bl.position.z = 0.17 + 0.58 * sc; g.add(bl);
      const tp = new THREE.Mesh(new THREE.ConeGeometry(0.055 * sc, 0.24 * sc, 4), bm); tp.rotation.set(Math.PI / 2, 0, Math.PI / 4); tp.position.z = 0.17 + 1.24 * sc; g.add(tp);

      const hd = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.035, 0.36), bm); hd.position.z = 0.94; g.add(hd);

  function makeDragon(sc = 1, col = 0x160a22, glow = 0xd946ef) {
    const g = new THREE.Group(), bm = mat(col, { r: 0.82, e: glow, ei: 0.22 }), wm = mat(0x2a0f3d, { r: 0.9, e: glow, ei: 0.18, dbl: true });

    const nk = new THREE.Mesh(new THREE.ConeGeometry(0.55, 3.2, 5), bm); nk.rotation.x = Math.PI / 2.2; nk.position.set(0, 0.55, 3.8); g.add(nk);
    const jw = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.48, 1.3), bm); jw.position.set(0, 0.75, 5.2); g.add(jw);
    const ey = new THREE.Mesh(new THREE.BoxGeometry(0.78, 0.14, 0.18), new THREE.MeshBasicMaterial({ color: 0xf43f5e })); ey.position.set(0, 0.95, 5.35); g.add(ey);
    const tl = new THREE.Mesh(new THREE.ConeGeometry(0.45, 6.2, 5), bm); tl.rotation.x = -Math.PI / 2; tl.position.set(0, -0.15, -5.6); g.add(tl);
    const mkW = (sd) => {
      const p = new THREE.Group(), sh = new THREE.Shape();
      sh.moveTo(0, 0); sh.lineTo(sd * 6.8, 1.6); sh.lineTo(sd * 8.4, -2.2); sh.lineTo(sd * 3.8, -1.6); sh.lineTo(0, -1.2);

    const g = new THREE.Group(); g.position.set(x, 0, z);
    const bx = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.72, 0.72), mat(0x4b2e1b, { map: TEX.wood })); bx.position.y = 0.36; g.add(bx);

    bm.position.y = 1.9; g.add(bm); mapG.add(g);
    const ch = { i: idx, g, bm, u: null };
    ch.u = { pos: new THREE.Vector3(x, 0, z), label: 'Open Treasure Chest', fn: () => {

  /* 7. COMBAT, PERFECT PARRY, 20-WAVE RAID & VAELGRYM DRAGON */
  function spawnFoe(c) {
    const rig = c.drag ? { root: makeDragon(1.55, 0x240718, 0xf43f5e), mats: {} } : makeKnight(c.armor || ARMORS[3]);
    rig.root.position.set(c.x, c.drag ? 2.6 : 0, c.z);
    if (!c.drag) { rig.root.scale.setScalar(c.sc || 1); if (c.wep) rig.handR.add(makeWep(c.wep)); }
    mapG.add(rig.root);
    foes.push({ ...c, rig, sx: c.x, sz: c.z, maxHp: c.hp, vel: new THREE.Vector3(), alive: true, deadT: 0, respT: 0, atkCD: 1.2 + Math.random() * 0.7, flashT: 0, stunT: 0, wp: Math.random() * 6 });
  }

    document.getElementById('raid-left').textContent = S.raidOn ? `Foes: ${foes.filter(e => e.alive).length}` : (S.cleared ? 'Rebirth Ready!' : `Next: Wave ${S.wave + 1}`);

  }

  function startWave() {
    if (S.map !== 'citadel' || S.raidOn) return;
    if (S.cleared) return openModal('rebirth');
    const wv = S.wave + 1; S.raidOn = true;
    const sc = (1 + S.rb * 0.72) * (1 + (wv - 1) * 0.24), cnt = Math.min(8, 2 + Math.floor(wv * 0.42));
    const archs = [
      ['Eclipse Footman', ARMORS[2], WEAPONS[1], 140, 12, 3.8, false],
      ['Shadow Assassin', ARMORS[3], WEAPONS[2], 120, 15, 4.9, false],
      ['Violet Warlock', ARMORS[6], WEAPONS[7], 130, 16, 3.1, true],
      ['Dread Halberdier', ARMORS[4], WEAPONS[3], 195, 18, 3.3, false]
    ];
    for (let i = 0; i < cnt; i++) {
      const a = (i / cnt) * Math.PI * 2, r = 14 + Math.random() * 10, [n, arm, wep, hp, atk, spd, rng] = archs[(wv + i) % 4];
      spawnFoe({ name: n, x: Math.cos(a) * r, z: Math.sin(a) * r - 4, hp: Math.round(hp * sc), atk: Math.round(atk * sc), spd, rng, armor: arm, wep, sc: 1.04, raid: true });
    }
    if (wv % 5 === 0) {
      const bm = { 5:['Warden Kael',ARMORS[4],WEAPONS[6],520,24,false], 10:['Inquisitor Malakor',ARMORS[5],WEAPONS[7],660,28,true], 15:['Eclipse Lord Vex',ARMORS[6],WEAPONS[9],820,32,true], 20:['Lord Vaelor',ARMORS[7],WEAPONS[10],1120,38,true] }[wv];
      spawnFoe({ name: bm[0], x: 0, z: -16, hp: Math.round(bm[3] * sc), atk: Math.round(bm[4] * sc), spd: 3.5, rng: bm[5], armor: bm[1], wep: bm[2], sc: 1.38, boss: true, raid: true });
      SFX.roar(); toast(`BOSS WAVE ${wv}: ${bm[0]}!`);
    } else toast(`WAVE ${wv} BEGINS!`);
    updateRaidUI();
  }

  function summonDragon() {
    if (S.rb < 10) return toast(`Requires Rebirth 10! (Now: R${S.rb})`);
    if (S.dragOn) return toast('Vaelgrym is already awakened!');

  }

  function burst(pos, col, n = 10, spd = 5.5) {
    const geo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.95 }));
      m.position.copy(pos); mapG.add(m);
      fxs.push({ m, v: new THREE.Vector3((Math.random() - 0.5) * 2, Math.random() * 1.3 + 0.2, (Math.random() - 0.5) * 2).normalize().multiplyScalar(spd * (0.4 + Math.random() * 0.8)), l: 0.45, ml: 0.45, g: 0 });
    }
  }

  function ring(pos, col, rad = 5, life = 0.4) {
    const r = new THREE.Mesh(new THREE.RingGeometry(0.35, 0.95, 20), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.85, side: THREE.DoubleSide }));
    r.rotation.x = -Math.PI / 2; r.position.set(pos.x, 0.14, pos.z); mapG.add(r);
    fxs.push({ m: r, v: new THREE.Vector3(), l: life, ml: life, g: rad / life });
  }

  function pop(wp, txt, col = '#fde047') {
    const v = wp.clone().add(new THREE.Vector3(0, 2, 0)).project(camera); if (v.z > 1) return;
    const el = document.createElement('div'); el.className = 'pop text-sm';
    el.style.left = ((v.x * 0.5 + 0.5) * window.innerWidth) + 'px'; el.style.top = ((-v.y * 0.5 + 0.5) * window.innerHeight) + 'px';
    el.style.color = col; el.textContent = txt; document.getElementById('pops').appendChild(el); setTimeout(() => el.remove(), 760);
  }

  function toast(msg) {
    const el = document.getElementById('toast'); el.textContent = msg; el.style.opacity = '1';
    clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.opacity = '0'; }, 2200);
  }

  function hitFoe(e, dmg, col = '#e2e8f0', knock = null, crit = false) {
    if (!e.alive) return;
    const val = Math.max(1, Math.round(dmg * (crit ? 1.55 : 1)));
    e.hp = Math.max(0, e.hp - val); e.flashT = 0.14;
    if (knock && !e.drag) e.vel.addScaledVector(knock, e.boss ? 2.5 : 5.5);
    S.tgt = e; S.tgtT = 5; SFX.hit();
    burst(e.rig.root.position.clone().add(new THREE.Vector3(0, 1.2, 0)), new THREE.Color(col).getHex(), 8);
    pop(e.rig.root.position, crit ? `${val}!` : `${val}`, crit ? '#fbbf24' : col);

    if (e.hp <= 0) {
      e.alive = false; e.deadT = 0.01;
      const g = reward(e.boss ? 180 : 42, e.boss ? 140 : 35); pop(e.rig.root.position, `+${g}g`, '#fbbf24');
      if (e.resp) e.respT = 14;
      if (e.gate && ++S.gateDead >= 3 && !S.gateOpen) {
        S.gateOpen = true;
        if (gateBar) { mapG.remove(gateBar); cols = cols.filter(c => !(c.z0 <= -54.5 && c.z1 >= -55.2 && c.x0 < 0 && c.x1 > 0)); }
        SFX.spell(); toast('CITADEL GATE UNLOCKED!'); save();
      }
      if (e.drag) {
        S.dragOn = false; S.dragSlain++; S.ess += 10; if (!S.ownW.includes('w12')) S.ownW.push('w12');
        stats(); save(); SFX.spell(); toast('VAELGRYM SLAIN! +10 ✦ & Dragonfang!');
      }
      if (e.raid && S.raidOn && foes.filter(x => x.raid && x.alive).length === 0) {
        S.raidOn = false; S.wave = Math.min(20, S.wave + 1);
        const wg = reward(90 + S.wave * 45, 70 + S.wave * 35);
        if (S.wave >= 20) { S.cleared = true; S.ess += 2; toast(`WAVE 20 CLEARED! +2 ✦ Rebirth Ready!`); }
        else toast(`Wave ${S.wave} Cleared! +${wg}g`);
        save(); updateRaidUI();
      } else if (e.raid) updateRaidUI();
    }
  }

  function hurtPlayer(raw, atkE = null) {
    if (S.rollT > 0) return;
    if (S.parryT > 0) {
      S.parryT = 0; S.parryCD = 0.25; S.mp = Math.min(S.maxMp, S.mp + 20); S.st = Math.min(S.maxSt, S.st + 22); S.shakeT = 0.16;
      SFX.parry(true); const fl = document.getElementById('fx-parry'); fl.style.opacity = '1'; setTimeout(() => fl.style.opacity = '0', 170);
      ring(S.pos, 0xfbbf24, 4.5, 0.35); pop(S.pos, 'PERFECT PARRY!', '#fbbf24');
      if (atkE && atkE.alive) { atkE.stunT = 2; hitFoe(atkE, stats().atk * 1.45, '#fde047', atkE.rig.root.position.clone().sub(S.pos).setY(0).normalize(), true); }
      return;
    }
    const dmg = Math.max(2, Math.round(raw * (100 / (100 + stats().def * 1.35))));
    S.hp = Math.max(0, S.hp - dmg); S.shakeT = 0.14;
    const fl = document.getElementById('fx-hurt'); fl.style.opacity = '1'; setTimeout(() => fl.style.opacity = '0', 140);
    pop(S.pos, `-${dmg}`, '#f87171');
    if (S.hp <= 0) {
      S.hp = S.maxHp; S.mp = S.maxMp; S.st = S.maxSt;
      if (S.map === 'citadel') {
        S.raidOn = false; foes.forEach(e => mapG.remove(e.rig.root)); foes = []; S.pos.set(0, 0, 24); updateRaidUI();
        toast(`Fallen! Retry Wave ${S.wave + 1}`);
      } else { S.pos.set(0, 0, 52); toast('Revived at Cottage'); }
    }
  }

  function spawnProj(c) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(c.rad || 0.25, 8, 6), new THREE.MeshBasicMaterial({ color: c.col }));
    m.position.copy(c.pos); mapG.add(m); projs.push({ ...c, m, life: c.life || 2.5 });
  }

  function aim3D() {
    const fwd = new THREE.Vector3(Math.sin(S.yaw), 0, Math.cos(S.yaw));
    let best = null, bd = 26;
    foes.forEach(e => {
      if (!e.alive) return;
      const to = e.rig.root.position.clone().add(new THREE.Vector3(0, e.drag ? 0.2 : 1.2, 0)).sub(S.pos.clone().add(new THREE.Vector3(0, 1.3, 0)));
      if (to.length() < bd && to.clone().setY(0).normalize().dot(fwd) > 0.55) { bd = to.length(); best = to.normalize(); }
    });
    return best || fwd;
  }

  function doAttack() {
    if (!S.started || S.modalOpen || S.atkT > 0) return;
    const st = stats();
    if (S.stance === 'wand') {
      if (S.mp < 5) return toast('Low Mana!');
      S.mp -= 5; S.atkDur = S.atkT = 0.3; S.castT = 0.25; SFX.spell();
      const d = aim3D(); spawnProj({ pos: S.pos.clone().add(new THREE.Vector3(0, 1.35, 0)).addScaledVector(d, 0.9), dir: d, spd: 28, dmg: st.mag, col: getM().orb, rad: 0.24 });
      return;
    }
    const w = getW(); S.atkDur = S.atkT = Math.max(0.24, 0.46 / w.spd); S.combo = (S.combo + 1) % 3; S.st = Math.max(0, S.st - 7); SFX.swing();
    const fwd = new THREE.Vector3(Math.sin(S.yaw), 0, Math.cos(S.yaw));
    const arc = new THREE.Mesh(new THREE.RingGeometry(w.reach * 0.5, w.reach * 0.96, 14, 1, -1.2, 2.4), new THREE.MeshBasicMaterial({ color: w.glow || 0x93c5fd, transparent: true, opacity: 0.78, side: THREE.DoubleSide }));
    arc.position.set(S.pos.x, S.pos.y + 1.15, S.pos.z); arc.rotation.set(-Math.PI / 2, 0, S.yaw - Math.PI / 2); mapG.add(arc);
    fxs.push({ m: arc, v: new THREE.Vector3(), l: 0.2, ml: 0.2, g: 1.5 });

    foes.forEach(e => {
      if (!e.alive) return;
      const to = e.rig.root.position.clone().sub(S.pos), d = Math.hypot(to.x, to.z);
      if (d <= w.reach + (e.drag ? 3.2 : 0.9)) {
        to.y = 0; if (to.lengthSq() > 0.001) to.normalize();
        if (to.dot(fwd) > 0.12 || d < 2.2) hitFoe(e, st.atk * (S.combo === 2 ? 1.25 : 1) * (0.92 + Math.random() * 0.16), '#e2e8f0', to, Math.random() < st.crit);
      }
    });
  }

  function doParry() {
    if (!S.started || S.modalOpen || S.parryCD > 0) return;
    S.parryT = 0.42; S.parryCD = 1.05; SFX.parry(false);
    projs.forEach(p => {
      if (p.fromE && p.m.position.distanceTo(S.pos.clone().add(new THREE.Vector3(0, 1.2, 0))) < 3.6) {
        p.fromE = false; p.dir.negate(); p.spd *= 1.45; p.dmg *= 3.2; p.m.material.color.setHex(0xfbbf24);
        SFX.parry(true); pop(S.pos, 'DEFLECTED!', '#fbbf24');
      }
    });
  }

  function doRoll() {
    if (!S.started || S.modalOpen || S.rollT > 0 || S.st < 20) return;
    S.st -= 20; S.rollT = 0.36; const mv = moveVec();
    S.rollDir.copy(mv.lengthSq() > 0.01 ? mv : new THREE.Vector3(Math.sin(S.yaw), 0, Math.cos(S.yaw)));
    burst(S.pos.clone().add(new THREE.Vector3(0, 0.3, 0)), 0x93c5fd, 6, 3);
  }

  function castSpell(slot) {
    if (!S.started || S.modalOpen || S.spCD[slot] > 0) return;
    const sp = getSp(S.eqS[slot]); if (S.mp < sp.mana) return toast(`Need ${sp.mana} MP`);
    S.mp -= sp.mana; S.spCD[slot] = sp.cd; S.castT = 0.35; SFX.spell();
    const dmg = stats().mag * sp.pow, d = aim3D(), fwd = new THREE.Vector3(Math.sin(S.yaw), 0, Math.cos(S.yaw));
    const orig = S.pos.clone().add(new THREE.Vector3(0, 1.35, 0)), hx = '#' + sp.col.toString(16).padStart(6, '0');
    if (sp.kind === 'bolt' || sp.kind === 'orb') spawnProj({ pos: orig.clone().addScaledVector(d, 0.9), dir: d, spd: sp.kind === 'orb' ? 20 : 30, dmg, col: sp.col, rad: sp.kind === 'orb' ? 0.42 : 0.25, exp: sp.kind === 'orb' ? 5.2 : 0 });
    else if (sp.kind === 'nova' || sp.kind === 'eclipse') {
      const r = sp.kind === 'eclipse' ? 11 : 7.2; ring(S.pos, sp.col, r, 0.45); burst(orig, sp.col, 18, 7.5);
      foes.forEach(e => { if (e.alive && Math.hypot(e.rig.root.position.x - S.pos.x, e.rig.root.position.z - S.pos.z) <= r) hitFoe(e, dmg, hx, e.rig.root.position.clone().sub(S.pos).setY(0).normalize(), sp.kind === 'eclipse'); });
    } else if (sp.kind === 'dash') {
      moveCol(fwd.clone().multiplyScalar(7.5)); ring(S.pos, sp.col, 4.6, 0.35);
      foes.forEach(e => { if (e.alive && e.rig.root.position.distanceTo(S.pos) < 5.5) hitFoe(e, dmg, hx, fwd); });
    } else if (sp.kind === 'heal') {
      const h = Math.round(dmg * 1.45); S.hp = Math.min(S.maxHp, S.hp + h); ring(S.pos, sp.col, 3.8, 0.45); pop(S.pos, `+${h} HP`, '#4ade80');
    }
  }

  /* 8. MOVEMENT, COLLISIONS & UNIFIED PC/MOBILE INPUTS */
  function moveCol(delta) {
    const r = 0.55, nx = S.pos.x + delta.x, nz = S.pos.z + delta.z; let bx = false, bz = false;
    for (const c of cols) {
      if (nx + r > c.x0 && nx - r < c.x1 && S.pos.z + r > c.z0 && S.pos.z - r < c.z1) bx = true;
      if (S.pos.x + r > c.x0 && S.pos.x - r < c.x1 && nz + r > c.z0 && nz - r < c.z1) bz = true;
    }
    if (!bx) S.pos.x = nx; if (!bz) S.pos.z = nz;
    if (S.map === 'citadel') { const d = Math.hypot(S.pos.x, S.pos.z); if (d > 33.8) { S.pos.x = S.pos.x / d * 33.8; S.pos.z = S.pos.z / d * 33.8; } }
    else { S.pos.x = THREE.MathUtils.clamp(S.pos.x, -76, 76); S.pos.z = THREE.MathUtils.clamp(S.pos.z, -66, 70); }
  }

  function moveVec() {
    let f = 0, s = 0;
    if (S.keys.KeyW || S.keys.ArrowUp) f++; if (S.keys.KeyS || S.keys.ArrowDown) f--;
    if (S.keys.KeyD || S.keys.ArrowRight) s++; if (S.keys.KeyA || S.keys.ArrowLeft) s--;
    if (S.joy.on) { s += S.joy.dx; f -= S.joy.dy; }
    const fwd = new THREE.Vector3(Math.sin(S.camYaw), 0, Math.cos(S.camYaw)), rt = new THREE.Vector3(-fwd.z, 0, fwd.x);
    const v = new THREE.Vector3().addScaledVector(fwd, f).addScaledVector(rt, s);
    return v.lengthSq() > 1 ? v.normalize() : v;
  }

  function bindTap(el, fn) {

    const clr = () => el.classList.remove('pressed'); el.addEventListener('touchend', clr); el.addEventListener('touchcancel', clr);
    el.addEventListener('click', e => { if (performance.now() - lt < 420) return; e.stopPropagation(); fn(); });
  }

      const d = document, el = d.documentElement;

      else { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); }

    const updJ = (tx, ty) => {
      const r = jb.getBoundingClientRect(), mR = Math.max(28, r.width * 0.36);
      let dx = tx - (r.left + r.width / 2), dy = ty - (r.top + r.height / 2), ln = Math.hypot(dx, dy);
      if (ln > mR) { dx = dx / ln * mR; dy = dy / ln * mR; }
      jk.style.transform = `translate(${dx}px,${dy}px)`; S.joy.dx = Math.abs(dx) < 5 ? 0 : dx / mR; S.joy.dy = Math.abs(dy) < 5 ? 0 : dy / mR;
    };

  /* 10. ANIMATION & REAL-TIME LOOP */
  let wp = 0; const lerp = (a, b, f) => a + (b - a) * Math.min(1, f);

  function update(dt, t) {
    const st = stats(), live = S.started && !S.modalOpen;
    if (live) {
      S.mp = Math.min(S.maxMp, S.mp + st.mpRegen * dt); S.st = Math.min(S.maxSt, S.st + 24 * dt);
      if (S.atkT > 0) S.atkT -= dt; if (S.castT > 0) S.castT -= dt; if (S.parryT > 0) S.parryT -= dt;
      if (S.parryCD > 0) S.parryCD = Math.max(0, S.parryCD - dt); if (S.shakeT > 0) S.shakeT -= dt; if (S.landT > 0) S.landT -= dt;
      for (let i = 0; i < 4; i++) {
        if (S.spCD[i] > 0) S.spCD[i] = Math.max(0, S.spCD[i] - dt);
        const cd = S.spCD[i], tx = cd > 0 ? cd.toFixed(1) : '';
        ['sc-', 'tc-'].forEach(p => { const el = document.getElementById(p + i); el.classList.toggle('hidden', cd <= 0); el.textContent = tx; });
      }
      for (let i = chestQ.length - 1; i >= 0; i--) { chestQ[i] -= dt; if (chestQ[i] <= 0) { chestQ.splice(i, 1); spawnChest(); } }
    }

    let mov = false;
    if (live) {
      if (S.rollT > 0) { S.rollT -= dt; moveCol(S.rollDir.clone().multiplyScalar(14.8 * dt)); S.yaw = Math.atan2(S.rollDir.x, S.rollDir.z); mov = true; }
      else {
        const mv = moveVec();
        if (mv.lengthSq() > 0.002) {
          moveCol(mv.clone().multiplyScalar(7.6 * st.spd * (S.mounted ? 1.55 : 1) * dt));
          let df = (S.fp ? S.camYaw : Math.atan2(mv.x, mv.z)) - S.yaw;
          while (df > Math.PI) df -= Math.PI * 2; while (df < -Math.PI) df += Math.PI * 2;
          S.yaw += df * Math.min(1, dt * 12); mov = true;
        } else if (S.fp) S.yaw = S.camYaw;
      }
    }
    const wasA = !S.onGround; S.vel.y -= 23 * dt; S.pos.y += S.vel.y * dt;
    if (S.pos.y <= 0) { S.pos.y = 0; S.vel.y = 0; S.onGround = true; if (wasA) { S.landT = 0.16; burst(S.pos.clone().add(new THREE.Vector3(0, 0.12, 0)), 0x94a3b8, 4, 2); } }

    // Articulated Knight Animation
    const rY = S.mounted ? 0.84 : 0; player.root.position.set(S.pos.x, S.pos.y + rY, S.pos.z); player.root.rotation.y = S.yaw;
    if (mov && S.onGround) wp += dt * (S.mounted ? 13 : 10.5 * st.spd);
    const sw = (mov && S.onGround && !S.mounted) ? Math.sin(wp) : 0;
    player.body.position.y = S.mounted ? Math.sin(wp) * (mov ? 0.08 : 0.015) : (S.landT > 0 ? -0.1 : Math.abs(sw) * 0.055 + Math.sin(t * 2.6) * 0.02);
    player.body.rotation.x = S.rollT > 0 ? (1 - S.rollT / 0.36) * Math.PI * 2 : lerp(player.body.rotation.x, mov ? 0.12 : 0, dt * 10);

    if (S.mounted) { player.legL.rotation.x = player.legR.rotation.x = -0.9; player.shinL.rotation.x = player.shinR.rotation.x = 0.85; }
    else if (!S.onGround) { player.legL.rotation.x = -0.5; player.legR.rotation.x = 0.45; player.shinL.rotation.x = 0.85; player.shinR.rotation.x = 0.35; }
    else {
      player.legL.rotation.x = lerp(player.legL.rotation.x, sw * 0.72, dt * 15); player.legR.rotation.x = lerp(player.legR.rotation.x, -sw * 0.72, dt * 15);
      player.shinL.rotation.x = lerp(player.shinL.rotation.x, Math.max(0, -sw) * 0.75 + (S.landT > 0 ? 0.35 : 0), dt * 15);
      player.shinR.rotation.x = lerp(player.shinR.rotation.x, Math.max(0, sw) * 0.75 + (S.landT > 0 ? 0.35 : 0), dt * 15);
    }
    if (S.parryT > 0) { player.armL.rotation.x = -1.25; player.foreL.rotation.x = -0.8; player.armR.rotation.x = -1.15; player.armR.rotation.z = -0.45; player.foreR.rotation.x = -0.7; }
    else if (S.atkT > 0 && S.stance === 'melee') {
      const p = 1 - S.atkT / S.atkDur;
      player.armR.rotation.x = S.combo === 2 ? (-2.2 + p * 2.9) : (-1.65 + p * 2.45);
      player.armR.rotation.z = S.combo === 1 ? (-0.7 + p * 1.4) : (0.65 - p * 1.3);
      player.foreR.rotation.x = -0.25 - Math.sin(p * Math.PI) * 0.45; player.body.rotation.y = (S.combo === 1 ? -1 : 1) * (0.35 - p * 0.7);
    } else if (S.castT > 0) { player.armR.rotation.x = -1.45; player.foreR.rotation.x = -0.3; player.body.rotation.y = 0; }
    else {
      player.armL.rotation.x = lerp(player.armL.rotation.x, -sw * 0.6, dt * 12); player.foreL.rotation.x = lerp(player.foreL.rotation.x, -0.28, dt * 12);
      player.armR.rotation.x = lerp(player.armR.rotation.x, sw * 0.52 - 0.16, dt * 12); player.armR.rotation.z = lerp(player.armR.rotation.z, 0.08, dt * 12);
      player.foreR.rotation.x = lerp(player.foreR.rotation.x, -0.32, dt * 12); player.body.rotation.y = lerp(player.body.rotation.y, 0, dt * 12);
    }
    player.capePiv.rotation.x = lerp(player.capePiv.rotation.x, (!S.onGround ? 0.72 : (mov ? 0.34 + Math.abs(sw) * 0.28 : 0.14)) + Math.sin(t * 3.1) * 0.08, dt * 10);
    parryRing.visible = S.parryT > 0 && !S.fp; if (parryRing.visible) parryRing.rotation.z += dt * 8;

    if (S.mounted) {
      horse.visible = !S.fp; horse.position.copy(S.pos); horse.rotation.y = S.yaw;
      const hd = horse.userData; hd.body.position.y = 1.08 + (mov ? Math.abs(Math.sin(wp)) * 0.12 : Math.sin(t * 2.2) * 0.02);
      hd.body.rotation.x = mov ? Math.sin(wp) * 0.08 : 0; hd.neck.rotation.x = mov ? Math.sin(wp - 0.6) * 0.16 : Math.sin(t * 1.8) * 0.05;
      hd.legs.forEach((l, i) => l.rotation.x = mov ? Math.sin(wp + i * 1.45) * 0.72 : 0);
    }
    if (S.fp && fpG.userData.rArm) {
      const { rArm, lArm } = fpG.userData, bob = mov ? Math.sin(wp * 1.2) * 0.025 : Math.sin(t * 2.2) * 0.006, ap = S.atkT > 0 ? Math.sin((1 - S.atkT / S.atkDur) * Math.PI) : 0;
      rArm.position.set(0.36, -0.34 + bob + (S.parryT > 0 ? 0.14 : 0), -0.52 - ap * 0.24); rArm.rotation.x = -ap * 0.95;
      lArm.position.y = -0.38 - bob + (S.parryT > 0 ? 0.16 : 0);
    }

    // Camera Follow + Shake
    const shk = S.shakeT > 0 ? (Math.random() - 0.5) * 0.14 : 0;
    if (S.fp) {
      camera.position.set(S.pos.x + shk, S.pos.y + (S.mounted ? 2.45 : 1.66) + shk, S.pos.z);
      camera.lookAt(camera.position.clone().add(new THREE.Vector3(Math.sin(S.camYaw) * Math.cos(S.camPitch), -Math.sin(S.camPitch), Math.cos(S.camYaw) * Math.cos(S.camPitch))));
    } else {
      const d = S.mounted ? 6.8 : 5.4, wt = new THREE.Vector3(S.pos.x - Math.sin(S.camYaw) * Math.cos(S.camPitch) * d, Math.max(0.85, S.pos.y + 1.9 + Math.sin(S.camPitch) * d + rY * 0.5), S.pos.z - Math.cos(S.camYaw) * Math.cos(S.camPitch) * d);
      if (S.map === 'citadel') { const cr = Math.hypot(wt.x, wt.z); if (cr > 34.2) { wt.x = wt.x / cr * 34.2; wt.z = wt.z / cr * 34.2; } }
      camera.position.lerp(wt, Math.min(1, dt * 11)); camera.position.x += shk; camera.position.y += shk;
      camera.lookAt(S.pos.x, S.pos.y + 1.45 + rY * 0.5, S.pos.z);
    }

    if (S.map === 'world') document.getElementById('zone-bar').textContent = S.pos.z > 44 ? 'Moonlit Cottage' : (S.pos.z > 0 ? 'Whispering Village' : (S.pos.z > -16 ? 'Moonlit River' : (S.pos.x < -34 ? "Dragon's Roost" : 'Citadel Gate')));
    let bU = null, bD = 3.8; uses.forEach(u => { const d = Math.hypot(u.pos.x - S.pos.x, u.pos.z - S.pos.z); if (d < bD) { bD = d; bU = u; } });
    nearUse = bU; const ub = document.getElementById('btn-use');
    if (bU && !S.modalOpen) { ub.classList.remove('hidden'); ub.textContent = `[E] ${bU.label}`; } else ub.classList.add('hidden');

    // Enemies & Projectiles
    if (live) {
      foes.forEach(e => {
        if (!e.alive) {
          if (e.deadT < 1) { e.deadT = Math.min(1, e.deadT + dt * 3.2); e.rig.root.rotation.x = -e.deadT * (Math.PI / 2); e.rig.root.position.y = Math.max(-0.2, e.rig.root.position.y - dt * 1.2); }
          else e.rig.root.visible = false;
          if (e.resp && (e.respT -= dt) <= 0) { e.alive = true; e.deadT = 0; e.hp = e.maxHp; e.rig.root.visible = true; e.rig.root.rotation.x = 0; e.rig.root.position.set(e.sx, 0, e.sz); }
          return;
        }
        if (e.flashT > 0 && e.rig.mats.priM) { e.flashT -= dt; e.rig.mats.priM.emissive.setHex(e.flashT > 0 ? 0xffffff : (e.armor ? e.armor.emi : 0)); e.rig.mats.priM.emissiveIntensity = e.flashT > 0 ? 0.9 : 0.25; }
        if (e.vel.lengthSq() > 0.01) { e.rig.root.position.addScaledVector(e.vel, dt); e.vel.multiplyScalar(Math.max(0, 1 - dt * 7)); }
        if (e.stunT > 0) { e.stunT -= dt; if (e.rig.body) e.rig.body.rotation.z = Math.sin(t * 22) * 0.16; return; } else if (e.rig.body) e.rig.body.rotation.z = 0;
        if (e.drag) { const ud = e.rig.root.userData, fl = Math.sin(t * 4.5) * 0.55; ud.wL.rotation.z = fl; ud.wR.rotation.z = -fl; e.rig.root.position.y = 2.6 + Math.sin(t * 2.2) * 0.7; }

        const toP = S.pos.clone().sub(e.rig.root.position), dist = Math.hypot(toP.x, toP.z);
        const safe = S.map === 'world' && S.pos.z > 45 && Math.abs(S.pos.x) < 6;
        if (dist < (e.raid || e.drag ? 65 : 18) && !safe) {
          e.rig.root.rotation.y = Math.atan2(toP.x, toP.z);
          if (dist > (e.rng ? (e.drag ? 13 : 10) : 2.3)) {
            toP.y = 0; toP.normalize(); e.rig.root.position.addScaledVector(toP, e.spd * dt);
            if (!e.drag) { e.wp += dt * 8.5; const es = Math.sin(e.wp); e.rig.legL.rotation.x = es * 0.65; e.rig.legR.rotation.x = -es * 0.65; }
          } else {
            e.atkCD -= dt; if (!e.drag) e.rig.armR.rotation.x = e.atkCD < 0.45 ? -1.85 : -0.2;
            if (e.atkCD <= 0) {
              e.atkCD = e.drag ? 2.1 : (e.rng ? 2.4 : 1.75);
              if (e.rng) {
                const orig = e.rig.root.position.clone().add(new THREE.Vector3(0, e.drag ? 0.5 : 1.3, 0));
                spawnProj({ pos: orig, dir: S.pos.clone().add(new THREE.Vector3(0, 1.1, 0)).sub(orig).normalize(), spd: e.drag ? 20 : 16, dmg: e.atk, col: e.drag ? 0xf43f5e : 0xc084fc, rad: e.drag ? 0.55 : 0.28, fromE: true, own: e });
              } else { if (!e.drag) e.rig.armR.rotation.x = 0.75; if (dist < 3.1) hurtPlayer(e.atk, e); }
            }
          }
        }
        if (S.map === 'citadel') { const er = Math.hypot(e.rig.root.position.x, e.rig.root.position.z); if (er > 32.5) { e.rig.root.position.x = e.rig.root.position.x / er * 32.5; e.rig.root.position.z = e.rig.root.position.z / er * 32.5; } }
      });

      for (let i = projs.length - 1; i >= 0; i--) {
        const p = projs[i]; p.life -= dt; p.m.position.addScaledVector(p.dir, p.spd * dt); let hit = p.life <= 0;
        if (!hit && p.fromE && p.m.position.distanceTo(S.pos.clone().add(new THREE.Vector3(0, 1.1, 0))) < 1.3 + p.rad) {
          if (S.parryT > 0) { p.fromE = false; p.dir.negate(); p.spd *= 1.45; p.dmg *= 3.2; p.m.material.color.setHex(0xfbbf24); SFX.parry(true); pop(S.pos, 'DEFLECTED!', '#fbbf24'); }
          else { hurtPlayer(p.dmg, p.own); hit = true; }
        } else if (!hit && !p.fromE) {
          for (const e of foes) if (e.alive && p.m.position.distanceTo(e.rig.root.position.clone().add(new THREE.Vector3(0, e.drag ? 0.2 : 1.15, 0))) < (e.drag ? 2.6 : 1.2) + p.rad) {
            hit = true; if (!p.exp) hitFoe(e, p.dmg, '#' + p.col.toString(16).padStart(6, '0'), p.dir); break;
          }
        }
        if (hit) {
          if (p.exp > 0) { ring(p.m.position, p.col, p.exp, 0.4); burst(p.m.position, p.col, 14, 7); foes.forEach(e => { if (e.alive && Math.hypot(e.rig.root.position.x - p.m.position.x, e.rig.root.position.z - p.m.position.z) <= p.exp) hitFoe(e, p.dmg, '#' + p.col.toString(16).padStart(6, '0')); }); }
          mapG.remove(p.m); projs.splice(i, 1);
        }
      }
    }

    for (let i = fxs.length - 1; i >= 0; i--) {
      const f = fxs[i]; f.l -= dt; f.m.position.addScaledVector(f.v, dt); if (f.g) f.m.scale.addScalar(f.g * dt);
      if (f.m.material && f.m.material.transparent) f.m.material.opacity = Math.max(0, f.l / f.ml);
      if (f.l <= 0) { mapG.remove(f.m); fxs.splice(i, 1); }
    }
    lights.forEach(f => f.l.intensity = f.base + Math.sin(t * 8 + f.ph) * 0.16);
    if (riverM) TEX.water.offset.x = (t * 0.08) % 1;
    if (skyDrag) {
      const a = t * 0.1; skyDrag.position.set(Math.cos(a) * 82, 46 + Math.sin(t * 0.5) * 4, -102 + Math.sin(a) * 34);
      skyDrag.rotation.y = -a; const fl = Math.sin(t * 3.8) * 0.52; skyDrag.userData.wL.rotation.z = fl; skyDrag.userData.wR.rotation.z = -fl;
    }
    npcs.forEach(r => { r.body.position.y = Math.sin(t * 2.1) * 0.025; if (r.root.position.distanceTo(S.pos) < 7) r.root.rotation.y = Math.atan2(S.pos.x - r.root.position.x, S.pos.z - r.root.position.z); });
    bobs.forEach(b => { b.m.position.y = b.y + Math.sin(t * 2.4) * 0.12; if (b.spin) b.m.rotation.y += dt * 1.4; });
    chests.forEach(c => { c.bm.rotation.y += dt * 1.2; });

    // HUD Sync
    document.getElementById('h-lv').textContent = S.lv;
    const pe = document.getElementById('h-pts'); pe.classList.toggle('hidden', S.pts <= 0); pe.textContent = `(+${S.pts})`;
    document.getElementById('h-gold').textContent = S.gold; document.getElementById('h-ess').textContent = S.ess; document.getElementById('h-rb').textContent = S.rb;
    document.getElementById('b-hp').style.width = (S.hp / S.maxHp * 100) + '%'; document.getElementById('t-hp').textContent = `${Math.ceil(S.hp)}/${S.maxHp}`;
    document.getElementById('b-mp').style.width = (S.mp / S.maxMp * 100) + '%'; document.getElementById('t-mp').textContent = `${Math.floor(S.mp)}/${S.maxMp}`;
    document.getElementById('b-st').style.width = (S.st / S.maxSt * 100) + '%'; document.getElementById('t-parry').textContent = S.parryCD > 0 ? S.parryCD.toFixed(1) + 's' : 'PARRY';
    const tb = document.getElementById('tgt-bar');
    if (S.tgt && S.tgt.alive && S.tgtT > 0) {
      S.tgtT -= dt; tb.classList.remove('hidden'); document.getElementById('tgt-nm').textContent = S.tgt.name;
      document.getElementById('tgt-hp').textContent = `${S.tgt.hp}/${S.tgt.maxHp}`; document.getElementById('tgt-f').style.width = (S.tgt.hp / S.tgt.maxHp * 100) + '%';
    } else tb.classList.add('hidden');
  }

  function loop() { requestAnimationFrame(loop); update(Math.min(clock.getDelta(), 0.05), clock.elapsedTime); renderer.render(scene, camera); }

  window.onload = () => {
    try {
      load(); initTex(); initScene(); buildWorld(); setupInputs();
      if (S.lv > 1 || S.rb > 0 || S.wave > 0) {
        const sb = document.getElementById('save-badge'); sb.textContent = `Lv.${S.lv} • R${S.rb} • Wave ${S.wave}/20`; sb.classList.remove('hidden');
      }
      bindTap(document.getElementById('btn-play'), () => {
        SFX.init(); S.started = true; document.getElementById('title').classList.add('hidden'); document.getElementById('hud').classList.remove('hidden');
        toast('Head north to Whispering Village & the Citadel Gate!');
      });
      loop();
    } catch (err) { console.error(err); toast('Error: ' + err.message); }
  };
})();
</script>
